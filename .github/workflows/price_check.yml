name: Daily Price Check (Cloud)

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    
    env:
      NIKE_EMAIL: ${{ secrets.NIKE_EMAIL }}
      NIKE_PASSWORD: ${{ secrets.NIKE_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          # Only install system deps if not cached
          if [ ! -f ~/.cache/ms-playwright/.deps-installed ]; then
            playwright install-deps chromium
            touch ~/.cache/ms-playwright/.deps-installed
          fi

      - name: Run price checker
        run: python main.py --cloud-only

      - name: Build Beer Money PWA
        run: python build_pwa.py

      - name: Commit updated price history + PWA
        run: |
          git config user.name "Price Tracker Bot"
          git config user.email "bot@price-tracker.local"
          git add price_history.json alert_state.json health_state.json docs/
          git diff --staged --quiet || git commit -m "📊 Price update $(date -u +%Y-%m-%d)"
          git push
